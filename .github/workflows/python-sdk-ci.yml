name: Python SDK CI

on:
  push:
    branches: [main, "ci/**", "feat/**", "fix/**", "feature/**", "ralph/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: clients/python

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install uv==0.9.18
      - run: uv sync --locked --extra dev

      - name: Check style
        run: uv run --locked --extra dev ruff format --check .

      - name: Check lint
        run: uv run --locked --extra dev ruff check .

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - run: pip install uv==0.9.18
      - run: uv sync --locked --extra dev

      - run: uv run --locked --extra dev mypy src/

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - run: pip install uv==0.9.18
      - run: uv sync --locked --extra dev

      - run: uv run --locked --extra dev pytest -q
