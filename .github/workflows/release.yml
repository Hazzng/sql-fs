name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build, push & maybe release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect topmost version in CHANGELOG
        id: detect
        run: |
          if [ ! -f CHANGELOG.md ]; then
            echo "::error::CHANGELOG.md not found"
            exit 1
          fi

          VERSION=$(awk '
            /^## \[Unreleased\]/ { next }
            /^## \[[^]]+\]/ {
              line = $0
              sub(/^## \[/, "", line)
              sub(/\].*/, "", line)
              print line
              exit
            }
          ' CHANGELOG.md)

          if [ -z "$VERSION" ]; then
            echo "::error::No versioned section (## [x.y.z]) found in CHANGELOG.md"
            exit 1
          fi

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::CHANGELOG version '$VERSION' is not valid SemVer. Expected MAJOR.MINOR.PATCH with optional -prerelease (e.g. 0.2.0, 1.0.0-rc.1). Build metadata (+...) is forbidden because Docker tags cannot contain '+'."
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "RELEASE=false" >> "$GITHUB_OUTPUT"
            echo "Tag v$VERSION already exists — only publishing :latest + :sha-<short>"
          else
            echo "RELEASE=true" >> "$GITHUB_OUTPUT"
            echo "Tag v$VERSION not found — will tag, push :v$VERSION, and create GitHub Release"
          fi

      - name: Extract CHANGELOG section
        if: steps.detect.outputs.RELEASE == 'true'
        id: changelog
        run: |
          VERSION="${{ steps.detect.outputs.VERSION }}"

          CONTENT=$(awk -v ver="$VERSION" '
            BEGIN { header = "## [" ver "]" }
            index($0, header) == 1 { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md | sed '/^$/d')

          if [ -z "$CONTENT" ] || [ "${CONTENT// /}" = "" ]; then
            echo "::error::No CHANGELOG entry found for version [$VERSION] in CHANGELOG.md"
            exit 1
          fi

          BYTES=$(printf '%s' "$CONTENT" | wc -c)
          if [ "$BYTES" -gt 10000 ]; then
            echo "::error::CHANGELOG entry for [$VERSION] is $BYTES bytes; max 10000."
            exit 1
          fi

          {
            echo "CONTENT<<EOF"
            echo "$CONTENT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Compute lowercase image name
        id: image
        run: |
          REPO_LC=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          echo "NAME=ghcr.io/${REPO_LC}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short
            type=raw,value=v${{ steps.detect.outputs.VERSION }},enable=${{ steps.detect.outputs.RELEASE == 'true' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create and push git tag
        if: steps.detect.outputs.RELEASE == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v${{ steps.detect.outputs.VERSION }}"
          git push origin "v${{ steps.detect.outputs.VERSION }}"

      - name: Create GitHub Release
        if: steps.detect.outputs.RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.detect.outputs.VERSION }}
          name: Release v${{ steps.detect.outputs.VERSION }}
          body: |
            ## Release v${{ steps.detect.outputs.VERSION }}

            ${{ steps.changelog.outputs.CONTENT }}

            ---

            **Image:** `${{ steps.image.outputs.NAME }}:v${{ steps.detect.outputs.VERSION }}`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
