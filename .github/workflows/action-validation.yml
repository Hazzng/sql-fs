name: Actions upgrade validation

on:
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  action-proof:
    if: github.head_ref == 'chore/action-upgrade-proof-20261014'
    name: Registry install and Docker build proof
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          registry-url: "https://registry.npmjs.org"
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir clients/typescript install --ignore-workspace --frozen-lockfile
      - run: pnpm check:typescript
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: sql-fs-action-proof
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short
            type=raw,value=v1.1.0,enable=true
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify built image
        run: |
          docker run --rm --entrypoint node sql-fs-action-proof:latest --version
          docker run --rm --entrypoint test sql-fs-action-proof:latest -f /app/dist/api/server.js
          docker run --rm --entrypoint test sql-fs-action-proof:latest -f /app/dist/sql-fs/migrations/postgres/0008_resolve_relative_symlinks.sql
