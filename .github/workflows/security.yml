name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm security:audit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install uv==0.9.18
      - name: Audit locked Python runtime dependencies
        run: |
          uv export --project clients/python --locked --no-dev --no-emit-project --no-hashes --format requirements-txt --output-file "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit==2.10.1 -r "$RUNNER_TEMP/requirements.txt"

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript,python
          build-mode: none
      - uses: github/codeql-action/analyze@v4
