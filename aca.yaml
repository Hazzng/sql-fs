# Azure Container Apps deployment config
# Deploy: az containerapp create --name sql-fs-api --resource-group <RG> --yaml aca.yaml
properties:
  managedEnvironmentId: /subscriptions/<SUB_ID>/resourceGroups/<RG>/providers/Microsoft.App/managedEnvironments/<ENV>
  configuration:
    ingress:
      external: true
      targetPort: 8080
      transport: http
      allowInsecure: false
    registries:
      - server: ghcr.io
        username: <GITHUB_USERNAME>
        passwordSecretRef: ghcr-token
    secrets:
      - name: database-url
        value: "<POOLER_URL>"
      - name: database-direct-url
        value: "<DIRECT_URL>"
      - name: auth-secret
        value: "<AUTH_SECRET>"
      - name: redis-url
        value: "<REDIS_URL>"
      - name: ghcr-token
        value: "<GITHUB_PAT>"
  template:
    containers:
      - name: api
        image: ghcr.io/<GITHUB_USERNAME>/sql-fs-api:latest
        resources:
          cpu: 1.0
          memory: 2Gi
        env:
          - name: FS_BACKEND
            value: postgres
          - name: DATABASE_URL
            secretRef: database-url
          - name: DATABASE_DIRECT_URL
            secretRef: database-direct-url
          - name: AUTH_SECRET
            secretRef: auth-secret
          - name: REDIS_URL
            secretRef: redis-url
          - name: PORT
            value: "8080"
        probes:
          - type: Liveness
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 15
          - type: Readiness
            httpGet:
              path: /readyz
              port: 8080
            periodSeconds: 10
          - type: Startup
            httpGet:
              path: /readyz
              port: 8080
            failureThreshold: 30
            periodSeconds: 2
    scale:
      minReplicas: 1
      maxReplicas: 10
      rules:
        - name: http-rule
          http:
            metadata:
              concurrentRequests: "50"
