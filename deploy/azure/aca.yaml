# Azure Container Apps deployment config
# Deploy: az containerapp create --name sql-fs-api --resource-group <RG> --yaml deploy/azure/aca.yaml
properties:
  managedEnvironmentId: /subscriptions/<SUB_ID>/resourceGroups/<RG>/providers/Microsoft.App/managedEnvironments/<ENV>
  configuration:
    ingress:
      external: true
      targetPort: 8080
      transport: http
      allowInsecure: false
    registries:
      - server: ghcr.io
        username: <GITHUB_USERNAME>
        passwordSecretRef: ghcr-token
    secrets:
      - name: database-url
        value: "<POOLER_URL>"
      - name: auth-secret
        value: "<AUTH_SECRET>"
      - name: redis-url
        value: "<REDIS_URL>"
      - name: ghcr-token
        value: "<GITHUB_PAT>"
  template:
    terminationGracePeriodSeconds: 90
    containers:
      - name: api
        image: ghcr.io/<GITHUB_USERNAME>/sql-fs@sha256:<IMAGE_DIGEST>
        resources:
          cpu: 1.0
          memory: 2Gi
        env:
          - name: FS_BACKEND
            value: postgres
          - name: DATABASE_URL
            secretRef: database-url
          - name: AUTH_SECRET
            secretRef: auth-secret
          - name: REDIS_URL
            secretRef: redis-url
          - name: PORT
            value: "8080"
          - name: REDIS_BLOB_CACHE_ENABLED
            value: "false"
          - name: SQL_FS_MAX_INGRESS_QUEUED_REQUESTS
            value: "64"
          - name: SQL_FS_MAX_INGRESS_TENANT_QUEUED_REQUESTS
            value: "16"
          - name: SQL_FS_MAX_INGRESS_WAIT_MS
            value: "5000"
          - name: SQL_FS_WORKER_QUEUE_WAIT_MS
            value: "5000"
          - name: SQL_FS_WORKER_EXECUTION_MS
            value: "45000"
        probes:
          - type: Liveness
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 15
            timeoutSeconds: 3
          - type: Readiness
            httpGet:
              path: /readyz
              port: 8080
            periodSeconds: 2
            timeoutSeconds: 3
          - type: Startup
            httpGet:
              path: /readyz
              port: 8080
            failureThreshold: 30
            periodSeconds: 2
    scale:
      minReplicas: 2
      maxReplicas: 10
      pollingInterval: 10
      cooldownPeriod: 30
      rules:
        - name: http-rule
          http:
            metadata:
              concurrentRequests: "1"
